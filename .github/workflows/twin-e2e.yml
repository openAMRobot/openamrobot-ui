# Headless browser test of the operator UI against a running digital twin.
#
# One job: the platform twin (openamr-platform-sw bringup.launch.py sim:=true use_docking:=false, Gazebo Harmonic
# headless, Nav2, twist_mux, stop gate, velocity_smoother, collision_monitor, /ui/cmd_vel relay and
# goal_pose_forwarder_node) at platform-sw#90's head, started through this repository's twin.launch.py with the
# restricted rosbridge (config/twin_bridge_allowlist.yaml, bound to 127.0.0.1) and the Flask app serving the bundle
# built from this commit. Then: graph snapshots, a client-side bridge probe, and Playwright (headless Chromium,
# web/e2e-twin/twin.spec.js).
#
# Runs on a push that changes .github/twin-e2e.trigger on this branch, or by workflow_dispatch once the file is on
# the default branch. Each run is about an hour of runner time. No secrets, no hardware: the stack is simulated.
# Simulation evidence only. Not hardware, physical or safety acceptance. #90 is not merged: this is twin evidence on
# an unmerged stop path, not rc.1 content.
name: Twin e2e (headless)

on:
  push:
    branches: [ui/twin-operator-view]
    paths:
      - '.github/twin-e2e.trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  # openamr-platform-sw#90 head (fork skunal3318), command arbitration and stop path, unmerged.
  PLATFORM_SW_REPO: skunal3318/openamr-platform-sw
  PLATFORM_SW_SHA: 2dd1c7425cd907939a543a0c260a30faadf29e1c
  INTERFACES_SHA: 50ed777be7990edbd3465f33fd97a158e7e3b88b
  ROS_APT_SOURCE_VERSION: '1.3.0'
  # Gazebo vendor builds as pinned by openamr-upperbody-sw baseline1-acceptance.yml and platform-sw #152.
  GZ_SIM_VENDOR: 0.0.13-1noble.20261031.125555
  GZ_TOOLS_VENDOR: 0.0.8-1noble.20261025.230735
  SDFORMAT_VENDOR: 0.0.14-1noble.20261031.120928
  GZ_SIM_VERSION: 8.15.0
  SDFORMAT_VERSION: 14.9.0
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: '<CycloneDDS><Domain Id="any"><Discovery><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>'
  ROS_DOMAIN_ID: '57'
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  QT_QPA_PLATFORM: offscreen

jobs:
  twin:
    name: Operator UI on the platform twin (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "ENV: ROS 2 Jazzy from packages.ros.org (pinned ros2-apt-source)"
        run: |
          sudo apt-get update
          sudo apt-get install -y curl locales software-properties-common
          sudo add-apt-repository -y universe
          curl --fail --location --retry 5 --retry-delay 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.noble_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base ros-dev-tools python3-colcon-common-extensions python3-pytest \
            python3-yaml python3-websockets xvfb
          sudo rosdep init || echo "rosdep init: already initialized"

      - name: "ENV: pinned Gazebo vendor builds"
        run: |
          sudo apt-get install -y --allow-downgrades \
            ros-jazzy-gz-sim-vendor=${GZ_SIM_VENDOR} \
            ros-jazzy-gz-tools-vendor=${GZ_TOOLS_VENDOR} \
            ros-jazzy-sdformat-vendor=${SDFORMAT_VENDOR}
          sudo apt-mark hold ros-jazzy-gz-sim-vendor ros-jazzy-gz-tools-vendor ros-jazzy-sdformat-vendor

      - name: "ENV: the stack (Nav2, ros_gz, twist_mux, rosbridge, CycloneDDS)"
        run: |
          sudo apt-get install -y ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-ros-gz \
            ros-jazzy-xacro ros-jazzy-robot-state-publisher ros-jazzy-joint-state-publisher ros-jazzy-twist-mux \
            ros-jazzy-opennav-docking ros-jazzy-slam-toolbox ros-jazzy-tf2-ros-py ros-jazzy-rmw-cyclonedds-cpp \
            ros-jazzy-rosbridge-server ros-jazzy-rosapi
          source /opt/ros/jazzy/setup.bash
          sim=$(gz sim --versions); sdf=$(gz sdf --versions)
          dpkg-query -W -f='${Package} ${Version}\n' | grep -E '^ros-jazzy-(navigation2|nav2-(bt-navigator|collision-monitor|velocity-smoother)|twist-mux|ros-gz-bridge|rosbridge-(server|library)|rosapi|rmw-cyclonedds-cpp|gz-sim-vendor)( |$)' | sort | tee versions.txt
          echo "gz sim ${sim}, gz sdf ${sdf}" | tee -a versions.txt
          test "${sim}" = "${GZ_SIM_VERSION}" && test "${sdf}" = "${SDFORMAT_VERSION}"
        shell: bash

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: ui
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ env.PLATFORM_SW_REPO }}
          ref: ${{ env.PLATFORM_SW_SHA }}
          path: platform/src/openamr-platform-sw
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: openAMRobot/openamrobot-interfaces
          ref: ${{ env.INTERFACES_SHA }}
          path: interfaces
          persist-credentials: false

      - name: "BUILD: platform twin packages"
        shell: bash
        working-directory: platform
        run: |
          cp -r ../interfaces/ros2/openamr_nav_msgs src/
          source /opt/ros/jazzy/setup.bash
          # openamrobot_drivers and openamrobot_docking are build dependencies of openamrobot_bringup for colcon
          # (run 44801004745 stopped there); docking itself stays off (use_docking:=false).
          colcon build --base-paths src --packages-select openamr_nav_msgs openamrobot_description \
            openamrobot_gazebo openamrobot_perception openamrobot_nav2 openamrobot_drivers openamrobot_docking \
            openamrobot_bringup --cmake-args -DBUILD_TESTING=OFF --event-handlers console_cohesion+
          { git -C src/openamr-platform-sw rev-parse HEAD; git -C ../interfaces rev-parse HEAD; git -C ../ui rev-parse HEAD; } | tee ../pins.txt
          test "$(sed -n 1p ../pins.txt)" = "$PLATFORM_SW_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: "BUILD: web bundle, synced into the ROS package with build-info.json"
        working-directory: ui
        env:
          OPENAMR_UI_COMMIT: ${{ github.sha }}
        run: |
          (cd web && npm ci && GENERATE_SOURCEMAP=false npm run build)
          bash scripts/sync_frontend_to_ros.sh

      - name: "BUILD: UI packages"
        shell: bash
        working-directory: ui/ros2
        run: |
          source /opt/ros/jazzy/setup.bash
          source ../../platform/install/setup.bash
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y -r --rosdistro jazzy --skip-keys "openamrobot_description ament_python"
          colcon build --event-handlers console_cohesion+
          cat > ../../twin_env.sh <<EOF
          source /opt/ros/jazzy/setup.bash
          source $GITHUB_WORKSPACE/platform/install/setup.bash
          source $GITHUB_WORKSPACE/ui/ros2/install/setup.bash
          EOF

      - name: "RUN: start the twin with twin.launch.py"
        shell: bash
        run: |
          source twin_env.sh
          mkdir -p out
          setsid xvfb-run -a ros2 launch openamr_ui_bringup twin.launch.py > out/twin.log 2>&1 &
          echo $! > out/launch.pid
          set +e
          ready=""
          for i in $(seq 1 120); do
            if timeout 10 ros2 topic echo --once /navigation/status openamr_nav_msgs/msg/NavigationStatus > out/first_navigation_status.txt 2>/dev/null \
               && curl -fsS http://127.0.0.1:5050/api/build-info > out/build-info.json; then ready=yes; break; fi
            sleep 5
          done
          echo "ready=${ready:-no} after ${i} polls" | tee out/ready.txt
          # Nav2 must be active before goals are sent.
          for i in $(seq 1 60); do
            timeout 10 ros2 service call /bt_navigator/get_state lifecycle_msgs/srv/GetState 2>/dev/null | grep -q "label='active'" && break
            sleep 5
          done
          timeout 10 ros2 service call /bt_navigator/get_state lifecycle_msgs/srv/GetState | tee -a out/ready.txt
          [ "$ready" = yes ]

      - name: "EVIDENCE: graph snapshot before the browser"
        if: always() && hashFiles('twin_env.sh') != ''
        shell: bash
        run: |
          source twin_env.sh
          {
            echo "### ros2 node list"; ros2 node list
            echo "### ros2 topic list -t"; ros2 topic list -t
            for t in /cmd_vel /ui/cmd_vel /goal_pose /safety/stop_lock /safety/stop_state /navigation/status /ui/map; do
              echo "### ros2 topic info -v $t"; ros2 topic info -v "$t"
            done
            echo "### docking nodes (use_docking false: expect none)"; ros2 node list | grep -iE "dock" || echo "none"
            echo "### rosbridge parameters"
            for p in address port topics_pub_glob topics_sub_glob services_glob actions_glob; do
              echo "$p: $(ros2 param get /rosbridge_websocket $p 2>&1)"
            done
            echo "### listening sockets"; ss -ltnp | grep -E ':(9090|5050)\b' || true
          } > out/graph_before.txt 2>&1
          cat out/graph_before.txt

      - name: "TEST: bridge probe (client side)"
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          source twin_env.sh
          remote=$(hostname -I | awk '{print $1}')
          rc=0
          python3 ui/scripts/twin_bridge_probe.py --url ws://127.0.0.1:9090 --remote-host "$remote" --out out/probe.json || rc=$?
          sleep 2
          # rosbridge refuses silently to the client; its own log names each refusal.
          grep -E "No match found for (topic|service|action)" out/twin.log | sort | uniq -c | tee out/probe_refusals.txt
          for t in /cmd_vel /ui/cmd_vel /initialpose; do
            ros2 topic info -v "$t" > "out/probe_${t//\//_}.txt" 2>&1
            if grep -q "rosbridge" "out/probe_${t//\//_}.txt"; then echo "FAIL: rosbridge publishes $t"; exit 1; fi
          done
          echo "no rosbridge publisher on /cmd_vel, /ui/cmd_vel, /initialpose"
          exit $rc

      - name: "TEST: Playwright against the twin (headless Chromium)"
        id: playwright
        continue-on-error: true
        working-directory: ui/web
        env:
          TWIN_ROS_ENV: ${{ github.workspace }}/twin_env.sh
          TWIN_EVIDENCE: ${{ github.workspace }}/out/browser
          TWIN_E2E_JSON: ${{ github.workspace }}/out/twin-e2e.json
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.twin.config.js

      - name: "EVIDENCE: graph snapshot after the browser, stop the twin"
        if: always()
        shell: bash
        run: |
          mkdir -p out
          [ -f twin_env.sh ] && source twin_env.sh
          { ros2 node list; ros2 topic info -v /cmd_vel; } > out/graph_after.txt 2>&1 || true
          pid=$(cat out/launch.pid 2>/dev/null) && kill -INT -- -"$pid" 2>/dev/null; sleep 15
          pkill -9 -f "gz sim" 2>/dev/null || true
          cp versions.txt pins.txt out/ 2>/dev/null || true
          echo "probe=${{ steps.probe.outcome }} playwright=${{ steps.playwright.outcome }}" | tee out/verdict.txt
          # Evidence in the log as well: artifacts are not readable from every review environment.
          echo "### browser steps"; cat out/browser/steps.jsonl 2>/dev/null || echo "none"
          echo "### graph after"; cat out/graph_after.txt
          {
            echo "### Twin e2e (headless), simulation evidence only"
            echo '```'; cat out/pins.txt out/verdict.txt; echo '```'
            echo '```'; cat out/probe_refusals.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: twin-e2e-evidence
          path: |
            out/
            ui/web/test-results/
          retention-days: 30

      - name: Verdict
        if: always()
        run: |
          test "${{ steps.probe.outcome }}" = success
          test "${{ steps.playwright.outcome }}" = success
